name: Emulator tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run catches new Android / Health Connect behaviour even without code changes.
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  instrumented:
    name: instrumented (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Android 14, 15, 16: all ship Health Connect in the OS.
        api-level: [34, 35, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-test-report-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/

  upgrade:
    name: upgrade from previous release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Find previous version
        id: prev
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Latest release tag; before the first release, a PR upgrades from its base branch.
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$tag" ] && [ -n "$BASE_REF" ]; then tag="origin/$BASE_REF"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then echo "::notice::No previous version to upgrade from; skipped."; fi
      - name: Build previous version (debug)
        if: steps.prev.outputs.tag != ''
        env:
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          git worktree add --detach ../prev "$PREV"
          (cd ../prev && ./gradlew assembleDebug)
          cp ../prev/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/old.apk"
      - name: Build current (debug + tests)
        if: steps.prev.outputs.tag != ''
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        if: steps.prev.outputs.tag != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install previous, seed data, upgrade, verify
        if: steps.prev.outputs.tag != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/upgrade-test.sh "$RUNNER_TEMP/old.apk" app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
