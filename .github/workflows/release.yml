name: Release

# Push a tag like v0.2.0 (matching versionName) to publish a signed APK as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version check against previous release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1)
          bash .github/scripts/check-version.sh "${prev:-HEAD}" "${TAG#v}"
          if [ -n "$prev" ]; then
            read -r cur _ < <(bash .github/scripts/version-of.sh)
            read -r old _ < <(bash .github/scripts/version-of.sh "$prev")
            if [ "$cur" -le "$old" ]; then echo "::error::versionCode must increase over $prev"; exit 1; fi
          fi
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then echo "::error::Release signing secrets missing"; exit 1; fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "HealthConnectSync-$TAG.apk"
          gh release create "$TAG" "HealthConnectSync-$TAG.apk" --title "$TAG" --generate-notes
